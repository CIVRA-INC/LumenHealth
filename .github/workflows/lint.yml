name: Lint, Format, and Typecheck

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-format-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build shared packages
        run: pnpm run build --filter @lumenhealth/shared --filter @lumenhealth/ui --filter @lumenhealth/rules-engine

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck
