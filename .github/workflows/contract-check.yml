name: Contract changelog

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  contract-changelog:
    name: Shared contract changes carry a changelog entry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Check contract changelog
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-contract-changelog.mjs
