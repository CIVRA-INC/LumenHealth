name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches docker-compose.yml. Development credentials for the CI service container only.
  DATABASE_URL: postgresql://lumen_app:lumen_app_dev_password@localhost:5432/lumenhealth
  MIGRATION_DATABASE_URL: postgresql://lumen:lumen_dev_password@localhost:5432/lumenhealth
  TEST_DATABASE_URL: postgresql://lumen_app:lumen_app_dev_password@localhost:5432/lumenhealth_test
  TEST_MIGRATION_DATABASE_URL: postgresql://lumen:lumen_dev_password@localhost:5432/lumenhealth_test
  E2E_DATABASE_URL: postgresql://lumen_app:lumen_app_dev_password@localhost:5432/lumenhealth_e2e
  E2E_MIGRATION_DATABASE_URL: postgresql://lumen:lumen_dev_password@localhost:5432/lumenhealth_e2e

jobs:
  quality:
    name: Format, lint, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  test:
    name: Migrations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lumen
          POSTGRES_PASSWORD: lumen_dev_password
          POSTGRES_DB: lumenhealth
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lumen -d lumenhealth"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create roles and databases
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=lumen_dev_password psql -h localhost -U lumen -d postgres -v ON_ERROR_STOP=1 -f infrastructure/docker/postgres/init.sql
      - name: Migrations apply cleanly to an empty database
        run: pnpm --filter @lumen/api exec prisma migrate deploy
      - name: Schema is valid
        run: pnpm --filter @lumen/api exec prisma validate
      - name: Unit and integration tests
        run: pnpm test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lumen
          POSTGRES_PASSWORD: lumen_dev_password
          POSTGRES_DB: lumenhealth
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lumen -d lumenhealth"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create roles and databases
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=lumen_dev_password psql -h localhost -U lumen -d postgres -v ON_ERROR_STOP=1 -f infrastructure/docker/postgres/init.sql
      - run: pnpm build:contracts
      - run: pnpm --filter @lumen/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
