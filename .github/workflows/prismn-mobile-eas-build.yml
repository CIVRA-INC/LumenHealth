name: Mobile EAS Build (standalone profile workflow)

# Standalone helper workflow for issue #1537. Not wired into release process by default;
# intended to be reviewed/adapted into active CI when mobile EAS credentials/profiles are configured.

on:
  workflow_dispatch:
  push:
    tags:
      - "mobile-v*"
  pull_request:
    types: [labeled]

jobs:
  eas-build:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'mobile-preview')
    name: EAS build (${{ matrix.platform }}) - ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            profile: production
          - platform: android
            profile: production
          - platform: ios
            profile: preview
          - platform: android
            profile: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Build
        working-directory: apps/mobile
        run: eas build --platform ${{ matrix.platform }} --profile ${{ matrix.profile }} --non-interactive --no-wait
      - name: Comment preview placeholder
        if: github.event_name == 'pull_request' && matrix.profile == 'preview' && matrix.platform == 'android'
        uses: actions/github-script@v7
        with:
          script: |
            core.info('Preview build submitted; attach EAS build link via eas build:list or expo action output when integrated.')
