name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=critical; then
              exit 0
            fi
            echo "npm audit attempt $attempt failed, retrying in 15s..." >&2
            sleep 15
          done
          echo "npm audit failed after 3 attempts (likely a registry outage), failing the build" >&2
          exit 1

      - name: Scan for hardcoded secrets
        uses: gitleaks/gitleaks-action@v1
